# for local development
services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  postgres:
      image: postgres:16
      environment:
        POSTGRES_USER: snake
        POSTGRES_PASSWORD: snake
        POSTGRES_DB: snake
      ports: ["5432:5432"]
      volumes: [pg-data:/var/lib/postgresql/data]
volumes:
  redis-data:
  pg-data:
